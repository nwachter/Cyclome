  deploy:
    name: Déploiement sur le VPS
    runs-on: ubuntu-latest
    # needs: [quality] #quality, e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - name: Connexion SSH et mise à jour
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          timeout: 60s
          script: |
            cd ~/nwproject-apps/cyclome
            git pull origin main
            docker compose -f docker-compose.prod.yml build app migrate
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d app
            sleep 5
            docker compose -f docker-compose.prod.yml exec -T app wget -qO- http://127.0.0.1:3000/api/health
            docker image prune -f
