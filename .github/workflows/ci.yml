name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DATABASE_URL: postgresql://cyclome:cyclome_ci@localhost:5432/cyclome_test
  BETTER_AUTH_SECRET: cle_de_test_ci_au_moins_32_caracteres_ok
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Qualité - tests unitaires & fonctionnels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyclome
          POSTGRES_PASSWORD: cyclome_ci
          POSTGRES_DB: cyclome_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cyclome"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Cohérence des tokens de design
        run: npm run tokens:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations sur base de test
        run: npx prisma migrate deploy
      - run: npm run test -- --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture
          path: coverage/

