name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DATABASE_URL: postgresql://cyclome:cyclome_ci@localhost:5432/cyclome_test
  BETTER_AUTH_SECRET: cle_de_test_ci_au_moins_32_caracteres_ok
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Qualité et tests unitaires
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyclome
          POSTGRES_PASSWORD: cyclome_ci
          POSTGRES_DB: cyclome_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cyclome"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Cohérence des tokens de design
        run: npm run tokens:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations sur base de test
        run: npx prisma migrate deploy
      - run: npm run test -- --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture
          path: coverage/

  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyclome
          POSTGRES_PASSWORD: cyclome_ci
          POSTGRES_DB: cyclome_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cyclome"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy && npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/

  deploy:
    name: Déploiement sur le VPS
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Connexion SSH et mise à jour
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/cyclome
            git pull origin main
            docker compose -f docker-compose.prod.yml build app
            docker compose -f docker-compose.prod.yml run --rm app npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
