# Dev : seule la base tourne dans Docker. L'app reste lancée sur la machine avec `npm run dev`=   garde le hot reload .
services:
  db:
    image: postgres:16-alpine
    container_name: cyclome-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyclo
      POSTGRES_PASSWORD: enrouelibre
      POSTGRES_DB: cyclome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclome -d cyclome"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: cyclome-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
