# Prod
# Pas de port publié : seul Caddy joint l'application (via container name).
# => réseau cyclome-network.
#la db posgre reste sur réseau interne (joignable ni depuis l'ext ni depuis les autres projets.)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyclome-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cyclome:${POSTGRES_PASSWORD}@db:5432/cyclome
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
      - cyclome-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Conteneur migrations pour déployer les migrations en production
  # Lancement manuel : docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://cyclome:${POSTGRES_PASSWORD}@db:5432/cyclome
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

  db:
    image: postgres:16-alpine
    container_name: cyclome-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyclome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cyclome
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclome -d cyclome"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  internal:
  # Réseau partagé avec Caddy (déclaré external coté caddy, doit donc être créé ici en 1e).
  cyclome-network:
    name: cyclome-network

volumes:
  postgres_data:
  uploads:
